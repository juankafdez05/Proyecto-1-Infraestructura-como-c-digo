---
- name: Esperar a que las máquinas estén accesibles
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Esperar a que SSH responda
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Esperar a que cloud-init termine
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

- name: Configuración común a todas las máquinas
  hosts: all
  roles:
    - commons

- name: Servidor de base de datos
  hosts: servidores_bd
  roles:
    - bd

- name: Servidor web
  hosts: servidores_web
  roles:
    - web

- name: Servidor central de registros
  hosts: servidores_analizador
  roles:
    - journal_remote

- name: Envío de registros al servidor central
  hosts: servidores_web:servidores_bd
  roles:
    - journal_upload

- name: Comprobar que los registros llegan al analizador
  hosts: servidores_analizador
  gather_facts: false
  tasks:
    - name: Consultar qué máquinas han enviado registros
      ansible.builtin.command: journalctl --directory=/var/log/journal/remote --field=_HOSTNAME
      register: maquinas_registros
      changed_when: false
      retries: 12
      delay: 5
      until: >-
        maquinas_registros.rc == 0 and
        'web' in maquinas_registros.stdout_lines and
        'bd' in maquinas_registros.stdout_lines

- name: Base de datos de Matomo
  hosts: servidores_bd
  roles:
    - matomo_bd

- name: Panel de análisis de registros (Matomo)
  hosts: servidores_analizador
  roles:
    - matomo
- name: Comprobar que Matomo funciona y guarda sus datos en bd
  hosts: servidores_analizador
  gather_facts: false
  tasks:
    - name: Comprobar que Matomo responde con su página de entrada
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php
        headers:
          Host: "{{ matomo_servername }}"
        return_content: true
      register: matomo_entrada
      failed_when: "'Sign in' not in matomo_entrada.content"

    - name: Comprobar que las tablas de Matomo están en bd
      community.mysql.mysql_query:
        login_db: "{{ matomo_bd_nombre }}"
        query: SELECT COUNT(*) AS n FROM information_schema.tables WHERE table_schema = %s
        positional_args:
          - "{{ matomo_bd_nombre }}"
        login_unix_socket: /run/mysqld/mysqld.sock
      delegate_to: bd
      register: matomo_tablas_bd
      changed_when: false
      failed_when: matomo_tablas_bd.query_result[0][0].n | int == 0

- name: Usuario de MariaDB para las copias de seguridad
  hosts: servidores_bd
  roles:
    - backup_bd

- name: Copias de seguridad semanales en analizador
  hosts: servidores_analizador
  roles:
    - backup
