---
- name: Instalar Apache, PHP con las extensiones que pide Matomo y unzip
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - unzip
    state: present
    lock_timeout: 120

- name: Descargar Matomo y comprobar su huella
  ansible.builtin.get_url:
    url: "https://builds.matomo.org/matomo-{{ matomo_version }}.zip"
    dest: "/var/tmp/matomo-{{ matomo_version }}.zip"
    checksum: "sha256:{{ matomo_sha256 }}"
    mode: "0644"

- name: Descomprimir Matomo en /var/www (solo la primera vez)
  ansible.builtin.unarchive:
    src: "/var/tmp/matomo-{{ matomo_version }}.zip"
    dest: /var/www
    remote_src: true
    creates: "{{ matomo_docroot }}/index.php"

- name: Dar la carpeta de Matomo a www-data (Apache necesita escribir en ella)
  ansible.builtin.file:
    path: "{{ matomo_docroot }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true

- name: Crear el virtual host de Matomo
  ansible.builtin.template:
    src: matomo.conf.j2
    dest: /etc/apache2/sites-available/matomo.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar Apache

- name: Activar el virtual host de Matomo
  ansible.builtin.command: a2ensite matomo.conf
  args:
    creates: /etc/apache2/sites-enabled/matomo.conf
  notify: Recargar Apache

- name: Desactivar el sitio por defecto de Apache
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar Apache

- name: Asegurar que Apache está activo y arranca con el sistema
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Aplicar ahora los cambios pendientes de Apache
  ansible.builtin.meta: flush_handlers
