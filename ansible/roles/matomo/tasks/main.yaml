---
- name: Instalar Apache, PHP con las extensiones que pide Matomo y unzip
  ansible.builtin.apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - unzip
    state: present
    lock_timeout: 120

- name: Descargar Matomo y comprobar su huella
  ansible.builtin.get_url:
    url: "https://builds.matomo.org/matomo-{{ matomo_version }}.zip"
    dest: "/var/tmp/matomo-{{ matomo_version }}.zip"
    checksum: "sha256:{{ matomo_sha256 }}"
    mode: "0644"

- name: Descomprimir Matomo en /var/www (solo la primera vez)
  ansible.builtin.unarchive:
    src: "/var/tmp/matomo-{{ matomo_version }}.zip"
    dest: /var/www
    remote_src: true
    creates: "{{ matomo_docroot }}/index.php"

- name: Dar la carpeta de Matomo a www-data (Apache necesita escribir en ella)
  ansible.builtin.file:
    path: "{{ matomo_docroot }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true

- name: Crear el virtual host de Matomo
  ansible.builtin.template:
    src: matomo.conf.j2
    dest: /etc/apache2/sites-available/matomo.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar Apache

- name: Activar el virtual host de Matomo
  ansible.builtin.command: a2ensite matomo.conf
  args:
    creates: /etc/apache2/sites-enabled/matomo.conf
  notify: Recargar Apache

- name: Desactivar el sitio por defecto de Apache
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: Recargar Apache

- name: Asegurar que Apache está activo y arranca con el sistema
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Aplicar ahora los cambios pendientes de Apache
  ansible.builtin.meta: flush_handlers

# --- Instalación de Matomo: rellenamos su asistente web como lo haría una persona ---

- name: Preguntar a Matomo si ya está instalado
  ansible.builtin.uri:
    url: http://127.0.0.1/index.php
    headers:
      Host: "{{ matomo_servername }}"
    return_content: true
  register: matomo_portada

- name: Instalar Matomo con su asistente (solo si aún no está instalado)
  when: matomo_portada.content is search('<title>[^<]*Installation')
  block:
    - name: "Asistente 1/5: datos de la base de datos de bd"
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php?module=Installation&action=databaseSetup
        method: POST
        headers:
          Host: "{{ matomo_servername }}"
        body_format: form-urlencoded
        body:
          host: "{{ ip_bd_datos }}"
          username: "{{ matomo_bd_usuario }}"
          password: "{{ matomo_bd_password }}"
          dbname: "{{ matomo_bd_nombre }}"
          tables_prefix: matomo_
          adapter: PDO\MYSQL
          schema: Mariadb
        follow_redirects: none
        status_code: 302

    - name: "Asistente 2/5: crear las tablas"
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php?module=Installation&action=tablesCreation
        headers:
          Host: "{{ matomo_servername }}"
        return_content: true
      register: matomo_tablas
      failed_when: "'Tables created' not in matomo_tablas.content"

    - name: "Asistente 3/5: crear el usuario administrador"
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php?module=Installation&action=setupSuperUser
        method: POST
        headers:
          Host: "{{ matomo_servername }}"
        body_format: form-urlencoded
        body:
          login: "{{ matomo_admin_usuario }}"
          password: "{{ matomo_admin_password }}"
          password_bis: "{{ matomo_admin_password }}"
          email: "{{ matomo_admin_email }}"
        follow_redirects: none
        status_code: 302
      no_log: true

    - name: "Asistente 4/5: dar de alta el libro de visitas"
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php?module=Installation&action=firstWebsiteSetup
        method: POST
        headers:
          Host: "{{ matomo_servername }}"
        body_format: form-urlencoded
        body:
          siteName: "{{ matomo_sitio_nombre }}"
          url: "{{ matomo_sitio_url }}"
          timezone: "{{ matomo_zona_horaria }}"
          ecommerce: "0"
        follow_redirects: none
        status_code: 302

    - name: "Asistente 5/5: terminar la instalación"
      ansible.builtin.uri:
        url: http://127.0.0.1/index.php?module=Installation&action=finished
        method: POST
        headers:
          Host: "{{ matomo_servername }}"
        body_format: form-urlencoded
        body:
          submit: "1"
        follow_redirects: none
        status_code: 302

- name: Hacer los informes con el temporizador y no al abrir el panel
  ansible.builtin.lineinfile:
    path: "{{ matomo_docroot }}/config/config.ini.php"
    insertafter: '^\[General\]'
    regexp: "^{{ item.clave }} ="
    line: "{{ item.clave }} = {{ item.valor }}"
  loop:
    - { clave: enable_browser_archiving_triggering, valor: 0 }
    - { clave: browser_archiving_disabled_enforce, valor: 1 }

# --- Importación automática de los registros ---

- name: Crear el servicio que importa los registros en Matomo
  ansible.builtin.template:
    src: matomo-importar.service.j2
    dest: /etc/systemd/system/matomo-importar.service
    owner: root
    group: root
    mode: "0644"
  notify: Recargar systemd

- name: Crear el temporizador que lanza la importación
  ansible.builtin.template:
    src: matomo-importar.timer.j2
    dest: /etc/systemd/system/matomo-importar.timer
    owner: root
    group: root
    mode: "0644"
  notify: Recargar systemd

- name: Aplicar ahora los cambios pendientes de systemd
  ansible.builtin.meta: flush_handlers

- name: Asegurar que el temporizador está activo y arranca con el sistema
  ansible.builtin.systemd_service:
    name: matomo-importar.timer
    state: started
    enabled: true
