- name: Instalar el cliente de MariaDB (trae mariadb-dump)
  ansible.builtin.apt:
    name: mariadb-client
    state: present
    lock_timeout: 120

- name: Crear la carpeta de configuración de las copias (solo root)
  ansible.builtin.file:
    path: /etc/copia-seguridad
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Guardar los datos de conexión a MariaDB (solo los puede leer root)
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: /etc/copia-seguridad/mariadb.cnf
    owner: root
    group: root
    mode: "0600"

- name: Crear las carpetas de las copias dentro del disco
  ansible.builtin.file:
    path: "{{ backup_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - registros
    - mariadb

- name: Copiar el script que hace la copia
  ansible.builtin.template:
    src: copia-seguridad.sh.j2
    dest: /usr/local/bin/copia-seguridad.sh
    owner: root
    group: root
    mode: "0755"

- name: Crear el servicio que lanza la copia
  ansible.builtin.template:
    src: copia-seguridad.service.j2
    dest: /etc/systemd/system/copia-seguridad.service
    owner: root
    group: root
    mode: "0644"
  notify: Recargar systemd


- name: Crear el temporizador que lanza la copia cada semana
  ansible.builtin.template:
    src: copia-seguridad.timer.j2
    dest: /etc/systemd/system/copia-seguridad.timer
    owner: root
    group: root
    mode: "0644"
  notify: Recargar systemd

- name: Aplicar ahora los cambios pendientes de systemd
  ansible.builtin.meta: flush_handlers

- name: Asegurar que el temporizador está activo y arranca con el sistema
  ansible.builtin.systemd_service:
    name: copia-seguridad.timer
    state: started
    enabled: true
