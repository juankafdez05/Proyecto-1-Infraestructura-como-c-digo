#cloud-config
hostname: analizador
manage_etc_hosts: true
timezone: Europe/Madrid
# Debian solo genera los locales activos en /etc/locale.gen. bootcmd se ejecuta
# antes del módulo locale, que de otro modo falla con es_ES.UTF-8.
bootcmd:
  - "[ ! -f /etc/locale.gen ] || sed -i 's/^# *es_ES.UTF-8 /es_ES.UTF-8 /' /etc/locale.gen"
locale: es_ES.UTF-8
ssh_pwauth: false
packages:
  - qemu-guest-agent
# En Debian el servicio no arranca solo al instalarlo en el primer arranque
runcmd:
  - systemctl start qemu-guest-agent
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  root@JuankaPortatil
